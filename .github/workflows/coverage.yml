name: Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: lcov.info
          flags: rust
          fail_ci_if_error: true

  extension-coverage:
    name: VS Code Extension Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage
        run: xvfb-run -a npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: apps/vscode-extension/coverage/lcov.info
          flags: vscode-extension
          fail_ci_if_error: true
