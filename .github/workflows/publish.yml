name: Publish Marketplace

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        type: string

env:
  NODE_VERSION: '22'

jobs:
  publish:
    name: Publish Visual Studio Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate workflow ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main so its OIDC identity matches the trusted credential."
            exit 1
          fi

      - name: Check out selected tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: apps/vscode-extension
        run: npm ci

      - name: Read extension version
        id: version
        working-directory: apps/vscode-extension
        shell: bash
        run: |
          extension_version=$(node -p "require('./package.json').version")
          echo "extension_version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Validate selected tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXTENSION_VERSION: ${{ steps.version.outputs.extension_version }}
        shell: bash
        run: |
          expected_tag="frilvault-v${EXTENSION_VERSION}"
          actual_tag="$RELEASE_TAG"

          if [ "$expected_tag" != "$actual_tag" ]; then
            echo "::error::Expected '$expected_tag', received '$actual_tag'."
            exit 1
          fi

      - name: Download VSIX files from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          mkdir -p dist/release

          gh release download "$RELEASE_TAG" \
            --pattern "*.vsix" \
            --dir dist/release

      - name: Show downloaded packages
        run: ls -lah dist/release

      - name: Verify expected packages
        shell: bash
        run: |
          version="${{ steps.version.outputs.extension_version }}"

          expected_files=(
            "frilvault-${version}-darwin-arm64.vsix"
            "frilvault-${version}-darwin-x64.vsix"
            "frilvault-${version}-linux-x64.vsix"
            "frilvault-${version}-win32-x64.vsix"
          )

          for file in "${expected_files[@]}"; do
            if [ ! -f "dist/release/$file" ]; then
              echo "::error::Missing dist/release/$file"
              exit 1
            fi
          done

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Marketplace publisher access
        working-directory: apps/vscode-extension
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npx @vscode/vsce verify-pat frillab --azure-credential

      - name: Publish platform packages
        working-directory: apps/vscode-extension
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          EXTENSION_VERSION: ${{ steps.version.outputs.extension_version }}
        shell: bash
        run: |
          version="$EXTENSION_VERSION"

          npx @vscode/vsce publish \
            --azure-credential \
            --packagePath "../../dist/release/frilvault-${version}-darwin-arm64.vsix"

          npx @vscode/vsce publish \
            --azure-credential \
            --packagePath "../../dist/release/frilvault-${version}-darwin-x64.vsix"

          npx @vscode/vsce publish \
            --azure-credential \
            --packagePath "../../dist/release/frilvault-${version}-linux-x64.vsix"

          npx @vscode/vsce publish \
            --azure-credential \
            --packagePath "../../dist/release/frilvault-${version}-win32-x64.vsix"
